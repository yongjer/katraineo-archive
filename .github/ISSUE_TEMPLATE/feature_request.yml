name: Feature request
description: An idea to make Katraineo better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would help
      description: What you are trying to do, and what is hard or missing today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
      description: Optional. How you imagine it, or how another program does it.
