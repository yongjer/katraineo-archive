name: Tauri app

on:
  push:
    branches: [main]
    tags: ["v*"] # a release: see "Releases" in DEVELOPMENT.md
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "tests-ts/**"
      - "resources/**"
      - "scripts/**"
      - "e2e/**"
      - "package.json"
      - "package-lock.json"
      - ".oxlintrc.json"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".github/workflows/tauri.yml"
  workflow_dispatch:
    inputs:
      macos_runner:
        description: "Runner label for the Apple Silicon build. The Homebrew libraries bundled with KataGo come from it, so a newer macOS can raise the app's minimum macOS."
        default: macos-15
      release:
        description: "preview: sign the installers and write latest.json as for a release, kept as an artifact. draft: release the version in package.json (run it on main): tag this commit v<version> and create a draft release, to publish by hand. publish: the same, published at once as the latest release."
        type: choice
        options: [none, preview, draft, publish]
        default: none

# A newer push to a pull request cancels the run of the older one, which would otherwise still wait for runners (the
# macOS ones above all). Every other run has a group of its own, so pushes to main, tags and runs started by hand are
# never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release.outputs.release }}
      sign: ${{ steps.release.outputs.sign }}
      version: ${{ steps.release.outputs.version }}
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2 # a pull request's merge commit and its base, for the files it changes
      # The platforms to build. A pull request builds the macOS apps only if it changes what they are built from
      # besides the frontend: the frontend is the same on every platform, and the Linux and Windows builds compile it
      # (and the end-to-end tests use it in WebKit on Linux). Everything else builds them all.
      - name: Choose the platforms to build
        id: platforms
        env:
          MACOS_RUNNER: ${{ inputs.macos_runner || 'macos-15' }}
        run: |
          set -euo pipefail
          macos=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            macos=false
            # the files the pull request changes: its merge commit against the base branch (the first parent)
            while IFS= read -r file; do
              case "$file" in
                src-tauri/* | resources/* | scripts/build-katago-macos.sh | package.json | package-lock.json | .github/workflows/tauri.yml)
                  echo "$file: build macOS"
                  macos=true
                  ;;
              esac
            done < <(git diff --name-only HEAD^1 HEAD)
          fi
          platforms='["windows-latest", "ubuntu-22.04"'
          # Apple Silicon (KataGo with Metal) and Intel (KataGo with OpenCL)
          if [ "$macos" = true ]; then platforms+=", \"$MACOS_RUNNER\", \"macos-15-intel\""; fi
          platforms+="]"
          echo "platforms=$platforms" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # What this run releases (see "Releases" in DEVELOPMENT.md): a tag v<version> makes a draft release, and a run
      # started by hand what its release input says. Checked first, so that a mistake fails before the builds.
      - name: Check what to release
        id: release
        env:
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && 'draft' || inputs.release || 'none' }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          case "$RELEASE" in
            none | preview) ;;
            draft | publish)
              if [[ "$GITHUB_REF" == refs/tags/* ]]; then
                if [ "$GITHUB_REF_NAME" != "$tag" ]; then
                  echo "::error::The tag is $GITHUB_REF_NAME, but the version is $version (scripts/set-version.mjs sets it)"
                  exit 1
                fi
              elif [ "$GITHUB_REF" != refs/heads/main ]; then
                echo "::error::Releases are made from main, not from $GITHUB_REF_NAME"
                exit 1
              fi
              # the commit the tag points to, if there is one (the second line, for an annotated tag)
              tagged=$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}" | tail -n1 | cut -f1)
              if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
                echo "::error::$version is already released, from commit $tagged: set the next version with scripts/set-version.mjs"
                exit 1
              fi
              ;;
            *)
              echo "::error::Unknown release input: $RELEASE"
              exit 1
              ;;
          esac
          {
            echo "release=$RELEASE"
            echo "sign=$([ "$RELEASE" = none ] && echo false || echo true)"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.test.outputs.platforms) }} # see "Choose the platforms to build"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev
          # copied into the AppImage (bundleMediaFramework): without them, playing a sound crashes the web view
          sudo apt-get install -y gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-alsa gstreamer1.0-pulseaudio
      # The macOS app bundles a KataGo built from source (with its libraries), cached per KataGo commit.
      # KataGo needs a recent SDK (e.g. quick_exit), so use the newest Xcode on the runner.
      - uses: maxim-lobanov/setup-xcode@v1
        if: startsWith(matrix.platform, 'macos')
        with:
          xcode-version: latest-stable
      - name: KataGo version for macOS
        if: startsWith(matrix.platform, 'macos')
        id: katago-ref
        run: echo "sha=$(git ls-remote https://github.com/lightvector/KataGo.git refs/heads/stable | cut -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: startsWith(matrix.platform, 'macos')
        id: katago-cache
        with:
          path: |
            resources/KataGo/katago-osx
            resources/KataGo/katago-libs
          key: katago-${{ matrix.platform }}-${{ steps.katago-ref.outputs.sha }}-${{ hashFiles('scripts/build-katago-macos.sh') }}
      - name: Build KataGo for macOS
        if: startsWith(matrix.platform, 'macos') && steps.katago-cache.outputs.cache-hit != 'true'
        run: scripts/build-katago-macos.sh
      - run: npm ci
      - run: npx tauri build
      - name: Check the bundled KataGo starts from inside the app
        if: startsWith(matrix.platform, 'macos')
        run: |
          app=src-tauri/target/release/bundle/macos/Katraineo.app
          otool -L "$app/Contents/Resources/KataGo/katago-osx"
          "$app/Contents/Resources/KataGo/katago-osx" version
          codesign --verify --verbose "$app"
      # KataGo for Linux is itself an AppImage. Check that packaging left it intact (linuxdeploy corrupts it if it is
      # below usr/lib) and that it starts.
      - name: Check the bundled KataGo starts from inside the packages
        if: startsWith(matrix.platform, 'ubuntu')
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1 # the runner may not have FUSE
        run: |
          set -euo pipefail
          sudo apt-get install -y ocl-icd-libopencl1
          bundle="$PWD/src-tauri/target/release/bundle"
          work="$(mktemp -d)"
          cd "$work"
          dpkg-deb -x "$bundle"/deb/*.deb deb
          dpkg-deb -f "$bundle"/deb/*.deb Depends
          "$bundle"/appimage/*.AppImage --appimage-extract > /dev/null
          for katago in deb/usr/share/Katraineo/KataGo/katago squashfs-root/usr/share/Katraineo/KataGo/katago; do
            test -x "$katago"
            cmp "$katago" "$GITHUB_WORKSPACE/resources/KataGo/katago"
            "$katago" version
          done
          test -z "$(find deb/usr/lib squashfs-root/usr/lib -type f -name katago)"
          # Not an absolute path: the AppImage shares this
          # entry, and would then start the installed program instead of its own.
          grep -Fx 'Exec=katraineo' deb/usr/share/applications/Katraineo.desktop
          grep -Fx 'Exec=katraineo' squashfs-root/*.desktop
          test -x deb/usr/bin/katraineo
          test -x squashfs-root/usr/bin/katraineo
          # the GStreamer plugins WebKit needs to play the sounds (WAV files)
          for plugin in coreelements playback typefindfunctions wavparse audioconvert audioresample autodetect alsa pulseaudio; do
            test -n "$(find squashfs-root -name "libgst$plugin.so")" || { echo "AppImage lacks GStreamer plugin $plugin"; exit 1; }
          done
      # Unpacks the MSI and installs the NSIS package. Every file is checked by name because the runner has its own
      # copies of some of the DLLs, so KataGo would start without them here. There is no GPU: analysis is not covered.
      - name: Check the bundled KataGo starts from inside the installers
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        timeout-minutes: 5
        run: |
          $bundle = "$PWD\src-tauri\target\release\bundle"
          $work = Join-Path $env:RUNNER_TEMP katraineo-check
          $msi = (Get-ChildItem "$bundle\msi\*.msi").FullName
          $setup = (Get-ChildItem "$bundle\nsis\*-setup.exe").FullName
          $p = Start-Process msiexec -ArgumentList '/a', "`"$msi`"", '/qn', "TARGETDIR=`"$work\msi`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec failed: $($p.ExitCode)" }
          $p = Start-Process $setup -ArgumentList '/S', "/D=$work\nsis" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the NSIS installer failed: $($p.ExitCode)" }
          $resources = (Get-Content src-tauri\tauri.windows.conf.json -Raw | ConvertFrom-Json).bundle.resources.PSObject.Properties.Value
          if (-not $resources) { throw "no resources listed in tauri.windows.conf.json" }
          Write-Host "Checking $(@($resources).Count) bundled files"
          $expected = (Get-FileHash resources\KataGo\katago.exe).Hash
          foreach ($root in "$work\msi", "$work\nsis") {
            $katago = (Get-ChildItem $root -Recurse -Filter katago.exe | Select-Object -First 1).FullName
            if (-not $katago) { throw "no katago.exe in $root" }
            $app = Split-Path (Split-Path $katago)
            foreach ($resource in $resources) {
              if (-not (Test-Path (Join-Path $app $resource))) { throw "$app lacks $resource" }
            }
            if ((Get-FileHash $katago).Hash -ne $expected) { throw "$katago differs from the one in the repository" }
            & $katago version
            if ($LASTEXITCODE -ne 0) { throw "$katago failed: $LASTEXITCODE" }
          }
      # What the updater installs on macOS: the app bundle as a .tar.gz with Katraineo.app at the top, named after the
      # architecture since both Macs build one. COPYFILE_DISABLE and --no-mac-metadata keep AppleDouble files out.
      - name: Pack the app for the updater
        if: startsWith(matrix.platform, 'macos') && needs.test.outputs.sign == 'true'
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          arch=$([ "$(uname -m)" = arm64 ] && echo aarch64 || echo x64)
          cd src-tauri/target/release/bundle/macos
          COPYFILE_DISABLE=1 tar --no-mac-metadata -czf "Katraineo_${version}_${arch}.app.tar.gz" Katraineo.app
          tar -tzf "Katraineo_${version}_${arch}.app.tar.gz" | cut -d/ -f1 | sort -u
      - uses: actions/upload-artifact@v5
        with:
          name: katraineo-tauri-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: ignore

  # Installs what the build job made on Windows and Linux, starts it and uses it through WebDriver:
  # KataGo, playing against the AI, pasting a game, dialogs, and finding an update (e2e/smoke.mjs). The runners have
  # no GPU, so the app uses KataGo's CPU build; the build job checks that the bundled KataGo starts.
  e2e:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 40
    env:
      KATAGO_EIGEN: https://github.com/lightvector/KataGo/releases/download/v1.18.1/katago-v1.18.1-eigenavx2
      E2E_OUT: ${{ github.workspace }}/e2e-output
      E2E_TLS_DIR: ${{ github.workspace }}/e2e-tls
      E2E_WEBVIEW2_PORT: 9222 # Windows: see "Install the app" below
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v5
        with:
          name: katraineo-tauri-${{ matrix.platform }}
          path: bundles
      - name: Install tauri-driver
        if: runner.os == 'Linux' # on Windows the test uses msedgedriver itself
        run: cargo install tauri-driver --locked
      # A test CA and server certificate, for the test update served over https
      - name: Make a test certificate
        shell: bash
        env:
          MSYS_NO_PATHCONV: 1 # Git Bash would turn /CN=... into a path
        run: |
          set -euo pipefail
          mkdir -p "$E2E_TLS_DIR" && cd "$E2E_TLS_DIR"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.pem -days 2 -subj /CN=katraineo-e2e-ca \
            -addext basicConstraints=critical,CA:TRUE -addext keyUsage=critical,keyCertSign
          openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj /CN=127.0.0.1
          printf 'basicConstraints=CA:FALSE\nsubjectAltName=IP:127.0.0.1\nextendedKeyUsage=serverAuth\n' > server.ext
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -out server.pem -days 2 -extfile server.ext

      - name: Install the app, WebKitWebDriver and KataGo (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ./bundles/deb/*.deb webkit2gtk-driver xvfb
          curl -sSfL -o "$RUNNER_TEMP/katago.zip" "$KATAGO_EIGEN-linux-x64.zip"
          unzip -q "$RUNNER_TEMP/katago.zip" -d "$RUNNER_TEMP/katago"
          {
            echo "KATRAINEO_APP=/usr/bin/katraineo"
            echo "KATAGO=$RUNNER_TEMP/katago/katago"
            echo "NATIVE_DRIVER=$(command -v WebKitWebDriver)"
            echo "XDG_CONFIG_HOME=$RUNNER_TEMP/xdg-config"
            echo "APPIMAGE_EXTRACT_AND_RUN=1" # KataGo for Linux is an AppImage, and the runner may not have FUSE
          } >> "$GITHUB_ENV"
      - name: Run the end-to-end test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node e2e/smoke.mjs

      - name: Install the app, msedgedriver and KataGo (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem bundles\nsis\*-setup.exe).FullName
          $dir = Join-Path $env:RUNNER_TEMP Katraineo
          $p = Start-Process $setup -ArgumentList '/S', "/D=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the NSIS installer failed: $($p.ExitCode)" }
          $app = (Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1).FullName
          if (-not $app) { throw "no app in $dir" }
          # msedgedriver must match the WebView2 runtime
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $webview = (Get-ItemProperty $key -ErrorAction SilentlyContinue).pv
          Write-Host "WebView2 $webview"
          $driver = $null
          try {
            Invoke-WebRequest "https://msedgedriver.microsoft.com/$webview/edgedriver_win64.zip" -OutFile "$env:RUNNER_TEMP\edgedriver.zip"
            Expand-Archive "$env:RUNNER_TEMP\edgedriver.zip" "$env:RUNNER_TEMP\edgedriver"
            $driver = "$env:RUNNER_TEMP\edgedriver\msedgedriver.exe"
          } catch {
            Write-Host "No msedgedriver $webview to download ($_), using the runner's"
            $driver = Join-Path $env:EDGEWEBDRIVER msedgedriver.exe
          }
          & $driver --version
          Invoke-WebRequest "${env:KATAGO_EIGEN}-windows-x64.zip" -OutFile "$env:RUNNER_TEMP\katago.zip"
          Expand-Archive "$env:RUNNER_TEMP\katago.zip" "$env:RUNNER_TEMP\katago"
          certutil -addstore -f Root "$env:E2E_TLS_DIR\ca.pem"
          # WebView2 133 and later no longer open the debugging port msedgedriver asks for when it starts the app
          # (actions/runner-images#14738). So the test starts the app itself, and this policy has the app's WebView2
          # open a port that msedgedriver attaches to. Both hives, as it is not documented which one wins.
          foreach ($hive in 'HKLM', 'HKCU') {
            $policy = "${hive}:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments"
            New-Item -Path $policy -Force | Out-Null
            New-ItemProperty -Path $policy -Name (Split-Path $app -Leaf) -PropertyType String -Force `
              -Value "--remote-debugging-port=$env:E2E_WEBVIEW2_PORT" | Out-Null
          }
          "KATRAINEO_APP=$app" >> $env:GITHUB_ENV
          "KATAGO=$env:RUNNER_TEMP\katago\katago.exe" >> $env:GITHUB_ENV
          "NATIVE_DRIVER=$driver" >> $env:GITHUB_ENV
      - name: Run the end-to-end test (Windows)
        if: runner.os == 'Windows'
        run: node e2e/smoke.mjs

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e-${{ matrix.platform }}
          path: e2e-output
          if-no-files-found: ignore

  # Every push to main refreshes one public prerelease, "tauri-nightly", with the latest installers.
  nightly:
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: tauri-nightly
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: katraineo-tauri-*
          path: bundles
          merge-multiple: true
      - name: Update the tauri-nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -f tauri-nightly "$GITHUB_SHA"
          git push -f origin tauri-nightly
          # GitHub keeps the date the release was first published, so the title says which build this is:
          # the commit's date (UTC) and short hash.
          title="Katraineo nightly $(TZ=UTC git log -1 --date=format-local:%Y-%m-%d --format=%cd "$GITHUB_SHA") (${GITHUB_SHA::7})"
          notes="Automatic build from the main branch, commit ${GITHUB_SHA}. Not a release: for testing only. macOS builds are unsigned."
          if gh release view tauri-nightly >/dev/null 2>&1; then
            gh release edit tauri-nightly --prerelease --title "$title" --notes "$notes"
          else
            gh release create tauri-nightly --prerelease --title "$title" --notes "$notes" --verify-tag
          fi
          mapfile -t files < <(find bundles -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \))
          printf '%s\n' "${files[@]}"
          gh release upload tauri-nightly "${files[@]}" --clobber

  # A release, or a preview of one (see "Releases" in DEVELOPMENT.md), once the end-to-end tests have passed: this signs
  # the installers for the updater (the only job with the signing key) and writes latest.json. A release then gets its
  # tag, if it was started by hand, and a GitHub release with all of them: a draft to publish by hand, or published at
  # once. A preview keeps the signatures and latest.json as an artifact instead.
  release:
    needs: [test, build, e2e]
    if: needs.test.outputs.sign == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE: ${{ needs.test.outputs.release }}
      VERSION: ${{ needs.test.outputs.version }}
      TAG: v${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          pattern: katraineo-tauri-*
          path: bundles
          merge-multiple: true
      - name: Sign the installers and write latest.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is not set (see Releases in DEVELOPMENT.md)"
            exit 1
          fi
          mkdir release
          find bundles -type f \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.msi' -o -name '*-setup.exe' \
            -o -name '*.deb' -o -name '*.AppImage' \) -exec cp {} release/ \;
          ls -l release
          for archive in release/*.app.tar.gz; do
            top=$(tar -tzf "$archive" | cut -d/ -f1 | sort -u)
            [ "$top" = Katraineo.app ] || { echo "::error::$archive holds $top, not only Katraineo.app"; exit 1; }
          done
          # the signatures carry the version, which the app requires (requireSignedVersion)
          for f in release/*.app.tar.gz release/*.msi release/*-setup.exe release/*.deb release/*.AppImage; do
            npx tauri signer sign --app-version "$VERSION" "$f" > /dev/null
          done
          node scripts/updater-manifest.mjs release "$VERSION" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" \
            "Katraineo $VERSION: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          cat release/latest.json
      - name: Keep the signatures and latest.json
        if: env.RELEASE == 'preview'
        uses: actions/upload-artifact@v5
        with:
          name: release-preview
          path: |
            release/*.sig
            release/latest.json
      - name: Create the release
        if: env.RELEASE == 'draft' || env.RELEASE == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The tag, for a release started by hand (a tag made with the workflow's token starts no other run).
          # The test job checked that the version had no tag yet: check again, as one may have been pushed since.
          tagged=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | tail -n1 | cut -f1)
          if [ -z "$tagged" ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null
          elif [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG is already the tag of commit $tagged"
            exit 1
          fi
          cat > notes.md <<NOTES
          ## Install

          * **macOS**: \`Katraineo_${VERSION}_aarch64.dmg\` (Apple Silicon) or \`Katraineo_${VERSION}_x64.dmg\` (Intel). The app is
            not signed by Apple, so macOS blocks it the first time it is opened: then go to System Settings → Privacy &
            Security and click *Open Anyway* (on macOS 14 or earlier, right click → Open in Finder works as well). If macOS
            says instead that Katraineo is damaged, run \`xattr -dr com.apple.quarantine /Applications/Katraineo.app\`.
          * **Windows**: \`Katraineo_${VERSION}_x64-setup.exe\` (or the \`.msi\`). SmartScreen may warn about an unknown publisher:
            choose *More info* → *Run anyway*.
          * **Linux**: the \`.AppImage\` (needs FUSE: \`sudo apt install libfuse2t64\`) or the \`.deb\`.

          Katraineo checks for updates when it starts, and installs them from the menu (*Check for Updates*).
          NOTES
          # Not a prerelease: the updater reads latest.json from the latest release. With the installers given here, gh
          # publishes the release only once they are all uploaded.
          if [ "$RELEASE" = publish ]; then publish=(--latest); else publish=(--draft); fi
          gh release create "$TAG" "${publish[@]}" --verify-tag --title "Katraineo $VERSION" --notes-file notes.md \
            --generate-notes release/*
